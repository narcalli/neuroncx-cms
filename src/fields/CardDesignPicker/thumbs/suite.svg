    <rect x="10.5" y="10.5" width="42" height="79" rx="6" fill="#ffffff" stroke="#e2e6ef"/>
    <rect x="19" y="17" width="25" height="3.5" rx="1.75" fill="#5a6379"/>
    <rect x="15" y="26" width="33" height="7" rx="3.5" fill="#edf0f6"/>
    <rect x="15" y="36" width="33" height="7" rx="3.5" fill="#edf0f6"/>
    <rect x="15" y="46" width="33" height="7" rx="3.5" fill="#edf0f6"/>
    <rect x="15" y="56" width="33" height="7" rx="3.5" fill="#edf0f6"/>
    <rect x="17" y="68" width="29" height="2.5" rx="1.25" fill="#8a92a6"/>
    <rect x="19" y="74" width="25" height="2.5" rx="1.25" fill="#8a92a6"/>
    <rect x="24" y="81" width="15" height="2.5" rx="1.25" fill="#c62828"/>
