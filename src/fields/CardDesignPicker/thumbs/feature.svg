<svg xmlns="http://www.w3.org/2000/svg" width="160" height="100" viewBox="0 0 160 100" fill="none">
  <!-- Feature card: white cards with a soft shadow, an eyebrow, title, text, a thin rule and a link. -->
  <rect width="160" height="100" rx="6" fill="#f6f7fa"/>
  <g id="card">
    <rect x="10" y="15.5" width="43" height="70" rx="7" fill="#e2e6ef" opacity=".7"/>
    <rect x="10" y="14" width="43" height="70" rx="7" fill="#ffffff"/>
    <rect x="16" y="21" width="20" height="6" rx="3" fill="#edf0f6"/>
    <rect x="16" y="32" width="25" height="4" rx="2" fill="#5a6379"/>
    <rect x="16" y="41" width="31" height="2.5" rx="1.25" fill="#c9ced8"/>
    <rect x="16" y="46" width="26" height="2.5" rx="1.25" fill="#c9ced8"/>
    <rect x="16" y="60" width="31" height="1" fill="#c9ced8"/>
    <rect x="16" y="68" width="17" height="2.5" rx="1.25" fill="#c62828"/>
  </g>
  <use href="#card" x="48"/>
  <use href="#card" x="96"/>
</svg>
